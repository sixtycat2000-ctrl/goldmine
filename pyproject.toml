[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# v2 item 4 (A10) — publish-ready metadata. NO publishing happens from the
# repo/tooling here; the manual release command (run by a human at release
# time, after the llama-server release asset is attached):
#   python3 -m pip install --quiet build twine
#   python3 -m build && python3 -m twine check dist/goldmine-0.2.0*
#   python3 -m twine upload dist/goldmine-0.2.0*
# (equivalent uv form: `uv build && uv publish`).
# Canonical project URLs remain unset until an actual remote is configured.

[project]
name = "goldmine"
version = "0.2.0"
description = "Ingest anything, search anything — a local-first macOS CLI over EmbeddingGemma 2."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "goldmine contributors" }]
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
foresight = ["grpcio>=1.60", "protobuf>=4.25"]
dev = ["pytest>=8"]

[project.scripts]
goldmine = "goldmine.cli:main"

[tool.setuptools.packages.find]
include = ["goldmine*"]

[tool.pytest.ini_options]
markers = [
    "live: tier-3 live tests; need GOLDMINE_LIVE=1 and real binaries/models",
    "eval: relevance / clustering-sensitivity harness (reports, rarely asserts)",
    "slow: long-running but fully offline (5 MB synthetic corpora; still runs in the default suite, ceiling kept well under 30 s)",
    "assets: verifies explicitly prepared real assets; separate from hermetic tests",
    "native: exercises real platform tools; separate from hermetic tests",
    "optional_mcp: official MCP SDK tests in the optional dependency environment",
    "optional_foresight: Foresight SDK tests in the optional dependency environment",
]
