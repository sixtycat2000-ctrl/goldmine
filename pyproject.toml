[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The wheel remains available for developers. End-user delivery uses the
# self-contained macOS bundle; release automation prepares drafts for review.

[project]
name = "goldmine"
version = "0.2.0"
description = "Ingest anything, search anything — a local-first macOS CLI over EmbeddingGemma 2."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "goldmine contributors" }]
dependencies = ["numpy>=1.26"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sixtycat2000-ctrl/goldmine"
Documentation = "https://github.com/sixtycat2000-ctrl/goldmine/blob/main/docs/INSTALL.md"
Issues = "https://github.com/sixtycat2000-ctrl/goldmine/issues"

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
dev = ["pytest>=8"]

[project.scripts]
goldmine = "goldmine.cli:main"

[tool.setuptools.packages.find]
include = ["goldmine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tier-3 live tests; need GOLDMINE_LIVE=1 and real binaries/models",
    "eval: relevance / clustering-sensitivity harness (reports, rarely asserts)",
    "slow: long-running but fully offline (5 MB synthetic corpora; still runs in the default suite, ceiling kept well under 30 s)",
    "assets: verifies explicitly prepared real assets; separate from hermetic tests",
    "native: exercises real platform tools; separate from hermetic tests",
    "optional_mcp: official MCP SDK tests in the optional dependency environment",
]
