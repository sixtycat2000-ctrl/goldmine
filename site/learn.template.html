<script>window.__earlyErr=[];window.addEventListener("error",function(e){window.__earlyErr.push(e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno)});</script>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-logo" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" transform="rotate(45 12 12)" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="9.5" r="1.8" fill="currentColor"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></symbol>
</svg>

<div class="progress" aria-hidden="true"></div>
<h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">goldmine Learn — interactive concept map / 交互式概念地图</h1>
<nav class="nav scrolled">
  <div class="nav-in">
    <a class="brand" href="index.html"><svg width="20" height="20"><use href="#i-logo"/></svg><b>goldmine</b></a>
    <div class="nav-links">
      <a href="index.html" data-zh="首页" data-en="Home">首页</a>
      <a href="docs.html" data-zh="文档" data-en="Docs">文档</a>
      <a href="learn.html" class="active" data-zh="Learn" data-en="Learn">Learn</a>
      <a href="https://github.com/sixtycat2000-ctrl/goldmine" aria-label="GitHub">GitHub</a>
      <div class="lang-pill" role="group" aria-label="language"><button data-lang="zh">中</button><button data-lang="en">EN</button></div>
    </div>
  </div>
</nav>

<div class="map-app">
  <div class="map-live" style="position:relative;height:100%;min-height:0">
    <span class="demo-note" data-zh="交互地图 · 内容为项目真实概念体系" data-en="Interactive map · real project concepts">交互地图 · 内容为项目真实概念体系</span>
    <canvas id="map" aria-hidden="true"></canvas>
    <div class="map-bar">
      <div class="search-box">
        <input id="map-search" type="search" placeholder="找概念 · find a concept （/）" aria-label="search concepts">
        <div class="results" role="listbox"></div>
      </div>
      <button id="list-toggle" class="bar-btn" aria-pressed="false" data-zh="目录" data-en="List">目录</button>
      <button id="help-btn" class="bar-btn" aria-label="shortcuts（?）">?</button>
      <span style="font:11px var(--mono);color:var(--sub-2)" data-zh="拖拽平移 · 滚轮缩放 · 单击选中 · 双击下探 · Esc 回上一层" data-en="drag to pan · wheel to zoom · click to select · double-click to drill · Esc to climb">拖拽平移 · 滚轮缩放 · 单击选中 · 双击下探 · Esc 回上一层</span>
    </div>
    <div id="shortcuts" class="shortcuts" hidden>
      <b data-zh="键盘" data-en="Keyboard">键盘</b>
      <span>/</span><i data-zh="搜索" data-en="search">搜索</i>
      <span>←↑↓→</span><i data-zh="按几何方向跳节点" data-en="nearest node in that direction">按几何方向跳节点</i>
      <span>Enter</span><i data-zh="下探（有子概念时）" data-en="drill when children exist">下探（有子概念时）</i>
      <span>Esc</span><i data-zh="关面板→回上一层→回地表" data-en="panel → climb one level → surface">关面板→回上一层→回地表</i>
      <span>+ − 0</span><i data-zh="缩放 / 复位" data-en="zoom / reset">缩放 / 复位</i>
      <span>L</span><i data-zh="中英切换" data-en="language">中英切换</i>
      <span>?</span><i data-zh="本面板" data-en="this panel">本面板</i>
    </div>
    <div class="breadcrumbs" aria-label="trail"></div>
    <div class="zoom-ui">
      <button id="zin" aria-label="zoom in"><svg width="18" height="18"><use href="#i-plus"/></svg></button>
      <button id="zout" aria-label="zoom out"><svg width="18" height="18"><use href="#i-minus"/></svg></button>
      <button id="zreset" aria-label="reset view"><svg width="18" height="18"><use href="#i-reset"/></svg></button>
    </div>
    <div id="depth-rail" class="depth-rail" role="group" aria-label="depth"></div>
    <div class="fallback" hidden></div>
  </div>

  <aside id="panel" aria-label="concept detail" inert>
    <button class="p-close" aria-label="close"><svg width="16" height="16"><use href="#i-close"/></svg></button>
    <span class="p-cluster"></span>
    <h2>—</h2>
    <p class="p-sub">—</p>
    <div class="tabs" role="tablist">
      <button data-tab="def" role="tab" class="on">定义</button>
      <button data-tab="plain" role="tab">大白话</button>
      <button data-tab="example" role="tab">实例</button>
      <span class="bar" aria-hidden="true"></span>
    </div>
    <div class="layer-body" role="tabpanel"></div>
    <div class="refs-block">
      <p class="p-sec" data-zh="真实代码 · REAL CODE" data-en="REAL CODE">真实代码 · REAL CODE</p>
      <ul class="refs"></ul>
    </div>
    <div class="deep-block">
      <p class="p-sec" data-zh="深挖 · DIG DEEPER" data-en="DIG DEEPER">深挖 · DIG DEEPER</p>
      <div class="deep-list"></div>
    </div>
  </aside>
</div>

<div id="node-list" class="sr-only" role="group" aria-label="concepts"></div>
<p id="map-live-region" class="sr-only" aria-live="polite"></p>
<script type="application/json" id="gm-graph">{{GRAPH_JSON}}</script>

<noscript>
<style>#map,.map-bar,.zoom-ui,.clusterbar,.breadcrumbs,#panel,#shortcuts{display:none}</style>
</noscript>
<script src="assets/app.js?v=dc1a47e0" defer></script>
<script>
// one-time boot sweep (skip for returning visitors / reduced motion)
try {
  if (!sessionStorage.getItem("gm-booted")
      && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.querySelector(".map-live").classList.add("boot");
    sessionStorage.setItem("gm-booted", "1");
    setTimeout(function () {
      var el = document.querySelector(".map-live");
      if (el) el.classList.remove("boot");
    }, 1200);
  }
} catch (e) {}
</script>
<script src="assets/map.js?v=dc1a47e0" defer></script>
</body>
</html>
