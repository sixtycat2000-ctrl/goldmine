<script>
document.documentElement.classList.add("js");
try{var l=localStorage.getItem("gm-lang");if(l)document.documentElement.setAttribute("lang",l==="en"?"en":"zh-CN")}catch(e){}
// if the app chunk (or its CSS) fails to load, reveal the baked glossary
window.addEventListener("error",function(e){
  var t=e.target;
  if(t&&(t.tagName==="SCRIPT"||t.tagName==="LINK")){
    try{document.documentElement.setAttribute("data-corrupt","")}catch(_){}
  }
},true);
</script>

<div id="root"></div>
<!--
  Baked by site/tools/build_learn.py: the graph JSON is inlined into the
  <script id="gm-graph"> data block below (consumed by the app at boot — no
  runtime fetch), and the marker div becomes the full 145-card no-JS glossary
  (kept in the DOM for crawlers and JS-less clients; hidden by CSS once the
  app mounts cleanly). Keep this comment free of the graph-substitution
  marker itself — Python str.replace replaces every occurrence of it.
-->
<script type="application/json" id="gm-graph">{{GRAPH_JSON}}</script>
<div class="fallback" hidden></div>
<script type="module" src="/src/learn/learn-main.tsx"></script>
