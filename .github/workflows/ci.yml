name: ci
# Free-tier budget discipline (private repo: Linux 1x, macOS 10x billing):
#   push  -> main:  one Linux guard job only (~6 runner minutes)
#   schedule/dispatch/PR: the full hosted matrix (the hosted acceptance
#   contract requires all seven jobs green in one run, so tiers that need a
#   certifiable hosted run execute everything; tiers that only gate a push
#   short-circuit the non-guard jobs before any runner work happens).
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
  schedule:
    # Mondays 02:00 UTC — full-matrix weekly health check.
    - cron: "0 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tier:
    name: tier
    runs-on: ubuntu-latest
    outputs:
      guard_only: ${{ steps.tier.outputs.guard_only }}
    steps:
      - id: tier
        run: |
          # A hosted acceptance collection needs the full matrix; a push to
          # main only needs the Linux guard. PRs, the weekly schedule and
          # manual dispatches run everything.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "guard_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "guard_only=false" >> "$GITHUB_OUTPUT"
          fi
  base_guard:
    name: base-ubuntu-latest-3.12
    needs: tier
    env:
      GOLDMINE_CI_JOB_KEY: base-ubuntu-latest-3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # acceptance tests git-archive pinned historical revisions
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/test.lock
      - run: python -m pip install -r requirements/test.lock
      - name: Install probed media tools
        run: |
          if [ "$(uname)" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          else
            brew install ffmpeg
          fi
      - name: Record actual environment
        run: |
          uname -m
          python --version
          python -m pip freeze
      - name: Hermetic source checks
        run: python scripts/ci_validation.py --profile base --out reports/ci/base
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: base-ubuntu-latest-3.12
          path: reports/ci/base

  base_full:
    name: base-${{ matrix.os }}-${{ matrix.python }}
    needs: tier
    if: always() && !cancelled() && needs.tier.outputs.guard_only != 'true'
    env:
      GOLDMINE_CI_JOB_KEY: base-${{ matrix.os }}-${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # acceptance tests git-archive pinned historical revisions
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/test.lock
      - run: python -m pip install -r requirements/test.lock
      - name: Install probed media tools
        run: |
          if [ "$(uname)" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          else
            brew install ffmpeg
          fi
      - name: Record actual environment
        run: |
          uname -m
          python --version
          python -m pip freeze
      - name: Hermetic source checks
        run: python scripts/ci_validation.py --profile base --out reports/ci/base
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: base-${{ matrix.os }}-${{ matrix.python }}
          path: reports/ci/base
  native:
    name: native-macos-arm64
    needs: tier
    if: always() && !cancelled() && needs.tier.outputs.guard_only != 'true'
    env:
      GOLDMINE_CI_JOB_KEY: native-macos-arm64
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: test "$(uname -m)" = arm64
      - run: brew install poppler ffmpeg xz
      - run: python -m pip install -r requirements/test.lock
      - name: Native source checks
        run: python scripts/ci_validation.py --profile native --out reports/ci/native
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-macos-arm64
          path: reports/ci/native
  optional:
    name: optional-${{ matrix.extra }}
    needs: tier
    if: always() && !cancelled() && needs.tier.outputs.guard_only != 'true'
    env:
      GOLDMINE_CI_JOB_KEY: optional-${{ matrix.extra }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        extra: [mcp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked optional environment
        run: |
          python -m pip install -r requirements/mcp.lock
          python -m pip install --no-deps -e .
      - name: SDK protocol checks
        env:
          EXTRA: ${{ matrix.extra }}
        run: python scripts/ci_validation.py --profile "$EXTRA" --out "reports/ci/$EXTRA"
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: optional-${{ matrix.extra }}
          path: reports/ci
  package:
    name: package-install
    needs: tier
    if: always() && !cancelled() && needs.tier.outputs.guard_only != 'true'
    env:
      GOLDMINE_CI_JOB_KEY: package-install
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/build.lock
      - name: Portable package proof
        run: python scripts/ci_hosted_package.py --out reports/ci
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-install
          path: reports/ci
