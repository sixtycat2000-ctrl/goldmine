name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  base:
    name: base-${{ matrix.os }}-${{ matrix.python }}
    env:
      GOLDMINE_CI_JOB_KEY: base-${{ matrix.os }}-${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/test.lock
      - run: python -m pip install -r requirements/test.lock
      - name: Record actual environment
        run: |
          uname -m
          python --version
          python -m pip freeze
      - name: Hermetic source checks
        run: python scripts/ci_validation.py --profile base --out reports/ci/base
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: base-${{ matrix.os }}-${{ matrix.python }}
          path: reports/ci/base
  native:
    name: native-macos-arm64
    env:
      GOLDMINE_CI_JOB_KEY: native-macos-arm64
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: test "$(uname -m)" = arm64
      - run: brew install poppler ffmpeg xz
      - run: python -m pip install -r requirements/test.lock
      - name: Native source checks
        run: python scripts/ci_validation.py --profile native --out reports/ci/native
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-macos-arm64
          path: reports/ci/native
  optional:
    name: optional-${{ matrix.extra }}
    env:
      GOLDMINE_CI_JOB_KEY: optional-${{ matrix.extra }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        extra: [mcp, foresight]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked optional environment
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          if [ "$EXTRA" = mcp ]; then
            python -m pip install -r requirements/mcp.lock
          else
            python -m pip install -r requirements/test.lock -r requirements/foresight.lock
          fi
          python -m pip install --no-deps -e .
      - name: SDK protocol checks
        env:
          EXTRA: ${{ matrix.extra }}
        run: python scripts/ci_validation.py --profile "$EXTRA" --out "reports/ci/$EXTRA"
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: optional-${{ matrix.extra }}
          path: reports/ci
  package:
    name: package-install
    env:
      GOLDMINE_CI_JOB_KEY: package-install
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/build.lock
      - name: Portable package proof
        run: python scripts/ci_hosted_package.py --out reports/ci
      - name: Upload raw proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-install
          path: reports/ci
