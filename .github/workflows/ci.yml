name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/test.lock
      - run: python -m pip install -r requirements/test.lock
      - name: Record actual environment
        run: |
          uname -m
          python --version
          python -m pip freeze
      - name: Hermetic source checks
        run: python scripts/ci_validation.py --profile base --out reports/ci/base
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: base-${{ matrix.os }}-${{ matrix.python }}
          path: reports/ci/base
  native:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: test "$(uname -m)" = arm64
      - run: brew install poppler ffmpeg xz
      - run: python -m pip install -r requirements/test.lock
      - run: python scripts/ci_validation.py --profile native --out reports/ci/native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-macos-arm64
          path: reports/ci/native
  optional:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        extra: [mcp, foresight]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked optional environment
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          if [ "$EXTRA" = mcp ]; then
            python -m pip install -r requirements/mcp.lock
          else
            python -m pip install -r requirements/test.lock -r requirements/foresight.lock
          fi
          python -m pip install --no-deps -e .
      - name: SDK protocol checks
        env:
          EXTRA: ${{ matrix.extra }}
        run: python scripts/ci_validation.py --profile "$EXTRA" --out "reports/ci/$EXTRA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: optional-${{ matrix.extra }}
          path: reports/ci
  package:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/build.lock
      - run: python scripts/build_python.py --python "$(command -v python)" --out reports/ci/python
      - name: Rebuild the exact sdist
        run: |
          sdist=(reports/ci/python/dist/*.tar.gz)
          test "${#sdist[@]}" -eq 1
          python scripts/build_python.py --python "$(command -v python)" --sdist "${sdist[0]}" --out reports/ci/sdist
      - name: Validate exact current Python artifacts
        run: |
          python -m twine check reports/ci/python/dist/*.whl reports/ci/python/dist/*.tar.gz reports/ci/sdist/dist/*.whl
          python -m pip download --only-binary=:all: --dest reports/ci/wheelhouse -r requirements/mcp.lock
      - name: Install outside source with and without MCP
        run: |
          wheel=(reports/ci/python/dist/*.whl)
          rebuilt=(reports/ci/sdist/dist/*.whl)
          test "${#wheel[@]}" -eq 1
          test "${#rebuilt[@]}" -eq 1
          python scripts/smoke_install.py --wheel "${wheel[0]}" --wheelhouse reports/ci/wheelhouse --profile base --out reports/ci/install-base
          python scripts/smoke_install.py --wheel "${wheel[0]}" --wheelhouse reports/ci/wheelhouse --profile mcp --out reports/ci/install-mcp
          python scripts/smoke_install.py --wheel "${rebuilt[0]}" --wheelhouse reports/ci/wheelhouse --profile base --out reports/ci/install-sdist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-install
          path: reports/ci
